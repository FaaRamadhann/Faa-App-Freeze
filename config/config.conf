# Faa App Freezer - default runtime configuration
# Disalin ke /data/adb/faf/config.conf saat install (tidak overwrite jika sudah ada)

# Auto-freeze daemon aktif? (true/false)
AUTO_FREEZE=true

# Jeda freeze otomatis setelah app keluar foreground (detik)
FREEZE_DELAY=60

# Terapkan target.list saat boot? (true/false)
APPLY_ON_BOOT=true

# Metode freeze: disable (pm disable-user) | suspend (pm suspend, API 29+)
FREEZE_METHOD=disable

# Lindungi dari restart paksa? kill proses setelah freeze (true/false)
RESTART_PROTECTION=true

# Hanya pantau aplikasi di target.list? (true/false)
# false = pantau semua user app (tidak disarankan, boros baterai)
TARGET_ONLY=true

# User Android yang dikelola (biasanya 0 = owner)
ANDROID_USER=0

# Level log: DEBUG INFO WARN ERROR
LOG_LEVEL=INFO
